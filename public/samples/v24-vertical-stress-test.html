<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>V2.4 Vertical Import Stress Test</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Inter,Arial,sans-serif}
  body{position:relative;display:grid;place-items:center}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .aurora{position:absolute;inset:-20%;filter:blur(60px);opacity:.5;mix-blend-mode:screen;animation:drift 7s ease-in-out infinite alternate}
  .aurora.a{background:radial-gradient(circle at 30% 25%,#8b5cf6 0 14%,transparent 42%),radial-gradient(circle at 70% 70%,#06b6d4 0 13%,transparent 38%)}
  .aurora.b{background:radial-gradient(circle at 75% 20%,#ec4899 0 9%,transparent 34%),radial-gradient(circle at 28% 76%,#3b82f6 0 12%,transparent 36%);animation-delay:-3s;animation-duration:9s}
  .grain{position:absolute;inset:0;opacity:.12;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);mix-blend-mode:soft-light;pointer-events:none}
  .rings{position:absolute;width:76vmin;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.11);animation:spin 14s linear infinite}
  .rings:before,.rings:after{content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
  .rings:after{inset:24%;border-style:dashed;animation:spinReverse 9s linear infinite}
  .content{position:relative;z-index:5;width:min(86vw,900px);padding:8vh 7vw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:28px}
  .eyebrow{padding:10px 18px;border:1px solid rgba(255,255,255,.18);border-radius:999px;letter-spacing:.18em;font-size:clamp(11px,1.8vw,22px);background:rgba(255,255,255,.045);backdrop-filter:blur(14px);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  h1{margin:0;font-size:clamp(56px,10.5vw,154px);line-height:.86;letter-spacing:-.065em;text-wrap:balance;animation:rise 1.15s .08s cubic-bezier(.2,.8,.2,1) both}
  .gradient{background:linear-gradient(120deg,#fff,#b7c6ff 32%,#9b8cff 56%,#5ee7f0 82%,#fff);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
  .sub{max-width:750px;margin:0;color:#aeb7c8;font-size:clamp(16px,2.7vw,34px);line-height:1.4;animation:rise 1.1s .18s cubic-bezier(.2,.8,.2,1) both}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,760px);margin-top:14px;animation:rise 1.1s .26s cubic-bezier(.2,.8,.2,1) both}
  .stat{padding:18px 10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.18)}
  .stat b{display:block;font-size:clamp(20px,4vw,46px)}
  .stat span{display:block;margin-top:5px;color:#8994a8;font-size:clamp(10px,1.6vw,18px);letter-spacing:.08em;text-transform:uppercase}
  .pulse{margin-top:16px;width:12px;height:12px;border-radius:50%;background:#7cf7ce;box-shadow:0 0 0 0 rgba(124,247,206,.6);animation:pulse 1.8s ease-out infinite}
  @keyframes rise{from{opacity:0;transform:translateY(56px) scale(.965);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
  @keyframes drift{from{transform:translate3d(-4%,-3%,0) scale(.98) rotate(-2deg)}to{transform:translate3d(5%,4%,0) scale(1.08) rotate(3deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinReverse{to{transform:rotate(-360deg)}}
  @keyframes shimmer{to{background-position:220% 0}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,247,206,.55)}70%{box-shadow:0 0 0 26px rgba(124,247,206,0)}100%{box-shadow:0 0 0 0 rgba(124,247,206,0)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="aurora a"></div>
<div class="aurora b"></div>
<div class="rings"></div>
<div class="grain"></div>
<main class="content">
  <div class="eyebrow">V2.4 · IMPORT STRESS TEST</div>
  <h1>Standalone HTML<br><span class="gradient">to vertical video.</span></h1>
  <p class="sub">Canvas particles · animated gradients · blur · glass · transforms · full-document import.</p>
  <section class="stats">
    <div class="stat"><b>9:16</b><span>Portrait</span></div>
    <div class="stat"><b>60</b><span>FPS target</span></div>
    <div class="stat"><b>H.264</b><span>MP4</span></div>
  </section>
  <div class="pulse"></div>
</main>
<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d', { alpha: true });
  const particles = Array.from({length: 150}, (_, i) => ({
    x: Math.random(), y: Math.random(), r: .6 + Math.random()*2.4,
    s: .015 + Math.random()*.055, phase: Math.random()*Math.PI*2,
    drift: (Math.random()-.5)*.05, hue: i%3
  }));
  let w=0,h=0,dpr=1;
  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.max(1, Math.floor(w*dpr));
    canvas.height = Math.max(1, Math.floor(h*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize); resize();
  function draw(now){
    const t = now/1000;
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      const yy = ((p.y - t*p.s)%1 + 1)%1;
      const xx = ((p.x + Math.sin(t*.8+p.phase)*p.drift)%1 + 1)%1;
      const alpha = .18 + .55*(.5+.5*Math.sin(t*1.7+p.phase));
      ctx.beginPath();
      ctx.arc(xx*w, yy*h, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.hue===0 ? `rgba(170,145,255,${alpha})` : p.hue===1 ? `rgba(91,224,255,${alpha})` : `rgba(255,255,255,${alpha*.75})`;
      ctx.fill();
      if (p.r > 2.2) {
        ctx.beginPath(); ctx.arc(xx*w, yy*h, p.r*5, 0, Math.PI*2);
        ctx.fillStyle = `rgba(120,180,255,${alpha*.04})`; ctx.fill();
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
